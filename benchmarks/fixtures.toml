# Benchmark fixture registry (maintained data, not code).
#
# Size tiers are anchored on link count (the dimension that drives resolve and
# pack cost):
#   S  10^2-10^3 links   smoke / correctness / CI-per-PR  -> bundled
#   M  10^4-10^5 links   "does it scale" middle           -> bundled (small real)
#   L  2.5x10^5+ links   advertisable headline            -> NOT committed
#
# The two bundled fixtures (leavenworth, rdu_i40) ship inside the gmnspy wheel;
# their on-disk paths are resolved from the package, so only the tier, formats,
# expected counts and selection cases live here.
#
# The L tier is never committed. Point the suite at a larger GMNS network with
# an environment variable (see the [large] section below), e.g.:
#
#   export GMNSPY_BENCH_LARGE=/path/to/rdu_metro        # dir of csv/parquet, or a .duckdb
#   .venv/bin/python -m gmnspy.cli.app bench-suite --sizes S,M,L
#
# or build one live from OSM (hits Overpass once):
#
#   export GMNSPY_BENCH_LARGE_BBOX="-78.95,35.74,-78.56,35.94"
#   .venv/bin/python -m gmnspy.cli.app bench-suite --sizes L --run-osm

schema_version = "1"

[[fixture]]
id = "leavenworth"
tier = "S"
formats = ["csv", "parquet", "duckdb"]
expected_links = 339
expected_nodes = 121
selections = [
  { case = "name_match", utterance = "Benton Street" },
  { case = "name_match_2", utterance = "Ski Hill Drive" },
  { case = "no_match", utterance = "Nonexistent Road 999" },
]

[[fixture]]
id = "rdu_i40"
tier = "M"
formats = ["csv", "parquet"]
expected_links = 178
expected_nodes = 143
selections = [
  { case = "ref_match", utterance = "I 40" },
  { case = "direction", utterance = "I 40 EB" },
  { case = "between_anchors", utterance = "I 40 between South Miami Boulevard and Page Road" },
  { case = "no_match", utterance = "Nonexistent Road 999" },
]

# L tier (not committed). `env_var` points at a GMNS package directory (csv or
# parquet) or a single .duckdb file; `bbox_env_var` optionally supplies an OSM
# bounding box ("west,south,east,north") for a live build under --run-osm.
[large]
id = "large"
tier = "L"
env_var = "GMNSPY_BENCH_LARGE"
bbox_env_var = "GMNSPY_BENCH_LARGE_BBOX"
selections = [
  { case = "ref_match", utterance = "I 40" },
  { case = "no_match", utterance = "Nonexistent Road 999" },
]
