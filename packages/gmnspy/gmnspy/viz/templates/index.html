<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gmnspy · viz</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.0.38/dist.min.js"></script>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --edge:#2a2f3a; --ink:#e6e8ec; --muted:#9aa3b2;
          --accent:#ff8c3b; --from:#35c46a; --to:#e0524d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
              color:var(--ink); background:var(--bg); }
  #app { display:grid; grid-template-columns:1fr 330px; grid-template-rows:auto 1fr; height:100%; }
  header { grid-column:1 / -1; display:flex; gap:10px; align-items:center; padding:12px 16px;
           background:var(--panel); border-bottom:1px solid var(--edge); }
  header h1 { font-size:14px; font-weight:600; margin:0 12px 0 0; color:var(--muted); }
  #utterance { flex:1; padding:9px 12px; border:1px solid var(--edge); border-radius:8px;
               background:#0c0e12; color:var(--ink); font-size:14px; }
  button { padding:9px 16px; border:0; border-radius:8px; background:var(--accent); color:#11151a;
           font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  #map { position:relative; width:100%; height:100%; }
  #controls { position:absolute; top:12px; right:12px; z-index:2; width:190px; padding:12px;
              background:rgba(23,26,33,.92); border:1px solid var(--edge); border-radius:10px;
              color:var(--ink); font-size:12.5px; backdrop-filter:blur(3px); }
  #controls .ctl-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  #controls label { color:var(--muted); }
  #controls select { flex:1; background:#0c0e12; color:var(--ink); border:1px solid var(--edge);
                     border-radius:6px; padding:4px 6px; font-size:12.5px; }
  #controls .ctl-layers { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; margin-bottom:10px;
                          padding-top:8px; border-top:1px solid var(--edge); }
  #controls .ctl-layers label { color:var(--ink); display:flex; align-items:center; gap:6px; cursor:pointer; }
  #legend:empty { display:none; }
  #legend { padding-top:8px; border-top:1px solid var(--edge); }
  .lg-item { display:flex; align-items:center; gap:7px; margin:3px 0; color:var(--ink); }
  .lg-sw { width:14px; height:10px; border-radius:2px; flex:none; }
  .lg-grad { height:10px; border-radius:2px; margin:4px 0 2px; }
  .lg-scale { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; }
  #side { background:var(--panel); border-left:1px solid var(--edge); padding:16px; overflow:auto; }
  .status { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .status.resolved { background:rgba(53,196,106,.15); color:var(--from); }
  .status.ambiguous { background:rgba(255,140,59,.15); color:var(--accent); }
  .status.not_found { background:rgba(224,82,77,.15); color:var(--to); }
  .label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin:16px 0 6px; }
  pre { background:#0c0e12; border:1px solid var(--edge); border-radius:8px; padding:10px;
        font-size:12px; white-space:pre-wrap; word-break:break-word; margin:0; }
  .diag { color:var(--muted); font-size:12.5px; margin:4px 0; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .empty { color:var(--muted); }
  #count { color:var(--muted); font-size:12px; margin-left:auto; }
  #details table { width:100%; border-collapse:collapse; }
  #details td { padding:3px 6px; border-bottom:1px solid var(--edge); font-size:12px; vertical-align:top; }
  #details td.k { color:var(--muted); white-space:nowrap; }
  #details td.v { word-break:break-word; max-width:200px; }
  #details .lid { color:var(--accent); font-weight:600; margin-bottom:4px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>gmnspy · viz</h1>
    <input id="utterance" placeholder='e.g. "I-40 EB between South Miami Boulevard and Airport Boulevard"' />
    <button id="go">Select</button>
    <span id="count"></span>
  </header>
  <div id="map">
    <div id="controls">
      <div class="ctl-row">
        <label for="colorby">Color by</label>
        <select id="colorby">
          <option value="none">None</option>
          <option value="facility_type">Facility type</option>
          <option value="lanes"># Lanes</option>
        </select>
      </div>
      <div class="ctl-layers">
        <label><input type="checkbox" id="tg-links" checked> Links</label>
        <label><input type="checkbox" id="tg-nodes" checked> Nodes</label>
        <label><input type="checkbox" id="tg-labels" checked> Labels</label>
        <label><input type="checkbox" id="tg-selection" checked> Selection</label>
        <label><input type="checkbox" id="tg-offset" checked> Offset dirs</label>
      </div>
      <div id="legend"></div>
    </div>
  </div>
  <aside id="side">
    <div id="status-wrap"><span class="empty">Click a link for details; hover to inspect; type an utterance to select.</span></div>
    <div class="label">Link details</div>
    <div id="details"><span class="empty">Click a link on the map.</span></div>
    <div class="label">Anchors</div>
    <div id="anchors"><span class="empty">—</span></div>
    <div class="label">Fragment</div>
    <pre id="fragment">—</pre>
    <div class="label">Diagnostics</div>
    <div id="diag"><span class="empty">—</span></div>
  </aside>
</div>
<script>
// map + basemap are built from /api/config (the basemap — incl. any API key —
// is provided by the server at runtime from env, never baked into this file).
let map = null, overlay = null;
let NET = null, ATTRS = null, ID2IDX = new Map();
let LANE_RANGE = [1, 1];
const CUR = { linkIds: [], anchors: [] };            // current selection
const STYLE = { colorBy: "none", offset: true, show: { links: true, nodes: true, labels: true, selection: true } };
// PathStyleExtension applies the lateral offset in BOTH the render and picking
// passes, so clicks match what's drawn (unlike a hand-rolled offset shader).
const OFFSET_EXT = (typeof deck.PathStyleExtension === "function") ? new deck.PathStyleExtension({ offset: true }) : null;
const OFFSET_AMT = 0.8;   // in path-width units; separates opposing directed links

const FT_PALETTE = {                                  // facility_type -> RGB (readable on light)
  motorway: [214, 69, 65], motorway_link: [214, 69, 65], trunk: [232, 119, 34], trunk_link: [232, 119, 34],
  primary: [240, 171, 0], primary_link: [240, 171, 0], secondary: [90, 160, 70], secondary_link: [90, 160, 70],
  tertiary: [60, 150, 140], tertiary_link: [60, 150, 140], residential: [120, 130, 160],
  service: [175, 182, 194], unclassified: [150, 150, 165], trunk_link_: [232, 119, 34],
};
const FT_DEFAULT = [110, 122, 150];
const FT_LEGEND_ORDER = ["motorway", "trunk", "primary", "secondary", "tertiary", "residential", "service", "unclassified"];
const LANE_STOPS = [[255, 237, 160], [254, 178, 76], [240, 59, 32]];   // YlOrRd

function laneRamp(t) {
  const x = Math.max(0, Math.min(1, t)) * (LANE_STOPS.length - 1);
  const i = Math.min(LANE_STOPS.length - 2, Math.floor(x)), f = x - i;
  const a = LANE_STOPS[i], b = LANE_STOPS[i + 1];
  return [0, 1, 2].map(k => Math.round(a[k] + (b[k] - a[k]) * f));
}
function linkColorRGB(i) {
  if (STYLE.colorBy === "facility_type") return FT_PALETTE[ATTRS.facility_type[i]] || FT_DEFAULT;
  if (STYLE.colorBy === "lanes") {
    const [mn, mx] = LANE_RANGE;
    return laneRamp(mx > mn ? (NET.linkLanes[i] - mn) / (mx - mn) : 0.5);
  }
  return [46, 64, 110];
}
function buildLinkColors() {                           // per-VERTEX RGBA (deck binary needs per-vertex)
  const n = NET.linkStart[NET.L.count], c = new Uint8Array(n * 4);
  for (let i = 0; i < NET.L.count; i++) {
    const [r, g, b] = linkColorRGB(i);
    for (let v = NET.linkStart[i]; v < NET.linkStart[i + 1]; v++) { c[v*4]=r; c[v*4+1]=g; c[v*4+2]=b; c[v*4+3]=220; }
  }
  NET.linkColors = c;
}
function refresh() { if (NET) render(CUR.linkIds, CUR.anchors); }

async function init() {
  const cfg = await fetch("/api/config").then(r => r.json());
  map = new maplibregl.Map({ container: "map", style: cfg.style, center: [-78.8, 35.88], zoom: 11 });
  map.addControl(new maplibregl.NavigationControl(), "top-left");
  overlay = new deck.MapboxOverlay({ interleaved: false, layers: [], getTooltip });
  map.addControl(overlay);
  map.on("load", loadNetwork);
}

function take(buf, off, bytes, Ctor) { return new Ctor(buf.slice(off, off + bytes)); }

async function loadNetwork() {
  const [buf, attrs] = await Promise.all([
    fetch("/api/network.bin").then(r => r.arrayBuffer()),
    fetch("/api/network.attrs.json").then(r => r.json()),
  ]);
  const hlen = new DataView(buf).getUint32(0, true);
  const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, hlen)));
  let off = 4 + hlen; const L = header.links, N = header.nodes;
  const linkPositions = take(buf, off, L.positionsBytes, Float32Array); off += L.positionsBytes;
  const linkStart = take(buf, off, L.startIndicesBytes, Uint32Array); off += L.startIndicesBytes;
  const linkIds = take(buf, off, L.idsBytes, Float64Array); off += L.idsBytes;
  const linkLanes = take(buf, off, L.lanesBytes, Uint8Array); off += L.lanesBytes;
  const nodePositions = take(buf, off, N.positionsBytes, Float32Array); off += N.positionsBytes;
  // deck.gl binary PathLayer wants per-VERTEX attributes: expand lane-width per vertex.
  const numVerts = linkStart[L.count];
  const linkWidths = new Float32Array(numVerts);
  for (let i = 0; i < L.count; i++) {
    const w = widthForLanes(linkLanes[i]);
    for (let v = linkStart[i]; v < linkStart[i + 1]; v++) linkWidths[v] = w;
  }
  NET = { L, N, linkPositions, linkStart, linkIds, linkLanes, linkWidths, nodePositions, linkColors: null };
  ATTRS = attrs;
  for (let i = 0; i < linkIds.length; i++) ID2IDX.set(linkIds[i], i);
  LANE_RANGE = [Math.min(...linkLanes), Math.max(...linkLanes)];
  document.getElementById("count").textContent = `${L.count.toLocaleString()} links · ${N.count.toLocaleString()} nodes`;
  buildLinkColors();
  wireControls();
  renderLegend();
  refresh();
  fitToNetwork(nodePositions);
}

function widthForLanes(lanes) {           // lanes -> pixel width; freeways pop
  return Math.max(1.2, Math.min(9, 0.9 + 0.8 * lanes));
}

function baseLayers() {
  const { L, N, linkPositions, linkStart, linkWidths, linkColors, nodePositions } = NET;
  const layers = [];
  if (STYLE.show.nodes) layers.push(new deck.ScatterplotLayer({ id: "nodes",
    data: { length: N.count, attributes: { getPosition: { value: nodePositions, size: 2 } } },
    getRadius: 1.8, radiusUnits: "pixels", radiusMinPixels: 1,
    getFillColor: [70, 90, 120, 130], pickable: false }));
  if (STYLE.show.links) {
    const props = { id: "links", _pathType: "open",
      data: { length: L.count, startIndices: linkStart,
              attributes: { getPath: { value: linkPositions, size: 2 },
                            getWidth: { value: linkWidths, size: 1 },
                            getColor: { value: linkColors, size: 4 } } },
      widthUnits: "pixels", widthMinPixels: 1,
      capRounded: true, jointRounded: true, pickable: true, autoHighlight: true,
      highlightColor: [255, 140, 59, 235], onClick: onLinkClick };
    if (OFFSET_EXT) { props.extensions = [OFFSET_EXT]; props.getOffset = STYLE.offset ? OFFSET_AMT : 0; }
    layers.push(new deck.PathLayer(props));
  }
  return layers;
}

function selectionLayers(linkIds, anchors) {
  const layers = [];
  if (!STYLE.show.selection) return layers;
  if (linkIds && linkIds.length) {
    const { linkPositions, linkStart } = NET;
    const positions = []; const startIndices = [0]; const widths = [];
    for (const id of linkIds) {
      const i = ID2IDX.get(id); if (i == null) continue;
      const a = NET.linkStart[i] * 2, b = NET.linkStart[i + 1] * 2;
      const w = widthForLanes(NET.linkLanes[i]) + 3;      // always proud of base
      for (let k = a; k < b; k += 2) { positions.push(linkPositions[k], linkPositions[k + 1]); widths.push(w); }
      startIndices.push(positions.length / 2);
    }
    layers.push(new deck.PathLayer({ id: "selection", _pathType: "open",
      data: { length: startIndices.length - 1, startIndices: new Uint32Array(startIndices),
              attributes: { getPath: { value: new Float32Array(positions), size: 2 },
                            getWidth: { value: new Float32Array(widths), size: 1 } } },
      getColor: [255, 140, 59, 255], widthUnits: "pixels", widthMinPixels: 3,
      capRounded: true, jointRounded: true, parameters: { depthTest: false } }));
  }
  if (anchors && anchors.length) {
    layers.push(new deck.ScatterplotLayer({ id: "anchors", data: anchors,
      getPosition: a => [a.lon, a.lat], getRadius: 7, radiusUnits: "pixels",
      getFillColor: a => a.role === "from" ? [53, 196, 106] : [224, 82, 77],
      getLineColor: [17, 21, 26], lineWidthMinPixels: 2, stroked: true,
      parameters: { depthTest: false } }));
  }
  return layers;
}

function render(linkIds, anchors) {
  overlay.setProps({ layers: [...baseLayers(), ...selectionLayers(linkIds, anchors)] });
}

const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
function renderLegend() {
  const el = document.getElementById("legend");
  if (STYLE.colorBy === "facility_type") {
    const present = new Set(ATTRS.facility_type);
    const items = FT_LEGEND_ORDER.filter(f => present.has(f));
    el.innerHTML = items.map(f => `<div class="lg-item"><span class="lg-sw" style="background:${rgb(FT_PALETTE[f] || FT_DEFAULT)}"></span>${f}</div>`).join("");
  } else if (STYLE.colorBy === "lanes") {
    const [mn, mx] = LANE_RANGE;
    const grad = `linear-gradient(90deg, ${rgb(LANE_STOPS[0])}, ${rgb(LANE_STOPS[1])}, ${rgb(LANE_STOPS[2])})`;
    el.innerHTML = `<div class="lg-item" style="margin-bottom:2px">lanes</div>` +
      `<div class="lg-grad" style="background:${grad}"></div>` +
      `<div class="lg-scale"><span>${mn}</span><span>${mx}</span></div>`;
  } else { el.innerHTML = ""; }
}

function toggleLabels(show) {                            // works for vector (symbol) + esri (raster 'labels')
  if (!map || !map.getStyle) return;
  for (const lyr of map.getStyle().layers || []) {
    if (lyr.type === "symbol" || lyr.id === "labels")
      map.setLayoutProperty(lyr.id, "visibility", show ? "visible" : "none");
  }
}

function wireControls() {
  const cb = document.getElementById("colorby");
  cb.value = STYLE.colorBy;
  cb.onchange = () => { STYLE.colorBy = cb.value; buildLinkColors(); renderLegend(); refresh(); };
  const bind = (id, key, after) => {
    const el = document.getElementById(id); el.checked = STYLE.show[key];
    el.onchange = () => { STYLE.show[key] = el.checked; (after || refresh)(); };
  };
  bind("tg-links", "links"); bind("tg-nodes", "nodes"); bind("tg-selection", "selection");
  bind("tg-labels", "labels", () => toggleLabels(STYLE.show.labels));
  const off = document.getElementById("tg-offset");
  off.checked = STYLE.offset; off.disabled = !OFFSET_EXT;
  off.onchange = () => { STYLE.offset = off.checked; refresh(); };
}

async function onLinkClick(info) {
  if (!info || info.index == null || info.index < 0) return;
  const id = ATTRS.link_id[info.index];
  const el = document.getElementById("details");
  el.innerHTML = `<div class="lid">link ${id}</div><span class="empty">loading…</span>`;
  try {
    const j = await (await fetch("/api/link/" + encodeURIComponent(id))).json();
    renderDetails(id, j.attributes || {});
  } catch (e) { el.innerHTML = `<div class="lid">link ${id}</div><span class="empty">error: ${e}</span>`; }
}
function renderDetails(id, attrs) {
  const rows = Object.entries(attrs)
    .filter(([k, v]) => k !== "link_id" && v !== null && v !== "")
    .map(([k, v]) => `<tr><td class="k">${k}</td><td class="v">${String(v)}</td></tr>`).join("");
  document.getElementById("details").innerHTML = `<div class="lid">link ${id}</div><table>${rows}</table>`;
}

function getTooltip({ layer, index }) {
  if (!layer || layer.id !== "links" || index == null || index < 0 || !ATTRS) return null;
  const id = ATTRS.link_id[index], nm = ATTRS.name[index], rf = ATTRS.ref[index], ft = ATTRS.facility_type[index];
  return { html: `<b>link ${id}</b><br>${nm || "<i>unnamed</i>"}${rf ? " · " + rf : ""}` +
                 `<br><span style="color:#8a93a3">${ft || ""}</span>`,
           style: { background: "#11151a", color: "#e6e8ec", fontSize: "12px",
                    padding: "6px 8px", borderRadius: "6px", border: "1px solid #2a2f3a" } };
}

function fitToNetwork(nodePositions) {
  const b = new maplibregl.LngLatBounds();
  for (let i = 0; i < nodePositions.length; i += 2) b.extend([nodePositions[i], nodePositions[i + 1]]);
  if (!b.isEmpty()) map.fitBounds(b, { padding: 50, maxZoom: 15, duration: 0 });
}

async function runSelect() {
  const q = document.getElementById("utterance").value.trim(); if (!q) return;
  const btn = document.getElementById("go"); btn.disabled = true;
  try {
    const j = await (await fetch("/api/select?utterance=" + encodeURIComponent(q))).json();
    CUR.linkIds = j.link_ids || []; CUR.anchors = j.anchors || [];
    refresh();
    if ((j.link_ids || []).length) {
      const b = new maplibregl.LngLatBounds();
      for (const id of j.link_ids) { const i = ID2IDX.get(id); if (i == null) continue;
        for (let k = NET.linkStart[i] * 2; k < NET.linkStart[i + 1] * 2; k += 2)
          b.extend([NET.linkPositions[k], NET.linkPositions[k + 1]]); }
      if (!b.isEmpty()) map.fitBounds(b, { padding: 80, maxZoom: 15, duration: 600 });
    }
    document.getElementById("status-wrap").innerHTML = `<span class="status ${j.status}">${j.status.replace("_", " ")}</span>`;
    document.getElementById("anchors").innerHTML = (j.anchors || []).length
      ? j.anchors.map(a => `<div><span class="dot" style="background:${a.role === "from" ? "#35c46a" : "#e0524d"}"></span>` +
          `<b>${a.role}</b> · node ${a.node_id} · ${a.kind} <span class="diag">(${a.detail})</span></div>`).join("")
      : '<span class="empty">none</span>';
    document.getElementById("fragment").textContent = j.fragment ? JSON.stringify(j.fragment, null, 2) : "—";
    document.getElementById("diag").innerHTML = (j.diagnostics || []).length
      ? j.diagnostics.map(d => `<div class="diag">• ${d}</div>`).join("") : '<span class="empty">—</span>';
  } finally { btn.disabled = false; }
}

document.getElementById("go").addEventListener("click", runSelect);
document.getElementById("utterance").addEventListener("keydown", e => { if (e.key === "Enter") runSelect(); });
init();
</script>
</body>
</html>
