# Build-cost model for the workbench's Open / Import wizard (gmnspy.workbench.estimate).
#
#   links   = n_elements * links_per_element
#   seconds = latency_s + links * s_per_link
#   bytes   = fixed_bytes[format] + links * bytes_per_link[format]
#
# n_elements is what the cheap pre-query returns for each source:
#   osm           ways matching the filter (Overpass `out count`)
#   overture      road segments in the bbox (DuckDB COUNT(*), same predicate as the read)
#   osm_file      size of the local .osm / .json file in bytes (no pre-query)
#   overture_file road segments in the local snapshot (COUNT(*))
#
# CALIBRATION NOTE (2026-10-02, macOS laptop, this repo's feat/workbench-p1a worktree):
#   Re-fit from live builds through the real workbench pipeline (plan_build/estimate_for/
#   fetch_and_convert/write_output), not the opt-in pytest shortcut, across a 4-rung area
#   ladder (bboxes, west/south/east/north):
#     XS  Leavenworth WA downtown   (-120.6625, 47.5955, -120.6425, 47.6155)  ~0.02 deg
#     S   downtown Durham NC        (-78.915, 35.985, -78.865, 36.035)        ~0.05 deg
#     M   Durham NC city            (-78.975, 35.925, -78.825, 36.075)        ~0.15 deg
#     L   Raleigh-Durham core       (-78.95, 35.74, -78.56, 35.94)            ~0.3 deg (known benchmark bbox)
#
#   * sources.osm: 10 successful OSM `drive` builds (XS x4 formats, S x4 formats incl. one
#     Overpass 504 retry, M parquet, L parquet). links_per_element = median(links/ways) = 3.65
#     (ways split far more than the old x2.5 guess assumed -- real OSM ways are heavily
#     subdivided at intersections). latency_s/s_per_link are an OLS fit of
#     (fetch+convert+write) seconds against links, using the per-area MEDIAN over repeated
#     format runs (same bbox fetched 3-4x) to damp Overpass-side timing noise -- and that noise
#     is large: the same XS query ranged 1.1s-28.4s run to run (likely Overpass-side caching /
#     load), and the M area (67k links) measured slower than the L area (303k links) despite
#     having far fewer links. The OLS fit absorbs most of that into latency_s, so this is a
#     best-effort central estimate, not a tight fit -- expect +/-20s real-world variance on any
#     single OSM fetch; recalibrate with more samples (ideally median-of-many-repeats per area)
#     before leaning on it for anything tighter than the 90s approval gate.
#   * sources.overture: the live Overture *pre-query* (COUNT(*) over S3 GeoParquet) was
#     measured successfully (8 samples, XS + S, ~16-18s each, dominated by remote footer/
#     row-group reads regardless of area size) -- latency_s below is from that. But every full
#     Overture *build* in this calibration run failed with a real bug, independent of
#     calibration: the current Overture release's `geometry` column now arrives as a native
#     duckdb GEOMETRY type (ibis GeoSpatialColumn), not raw WKB binary, so
#     gmnspy.overture.query's `_st_geom_from_wkb` UDF wrapper (which declares `wkb: binary`)
#     raises ibis.common.exceptions.SignatureValidationError before any rows are fetched (see
#     follow-up task to fix gmnspy/overture/query.py). links_per_element, s_per_link, and this
#     source's share of the output-size tables below are therefore UNCHANGED GUESSES, not
#     recalibrated -- they could not be measured until that bug is fixed. The old pinned
#     `OVERTURE_RELEASE = "2025-12-17.0"` in gmnspy/overture/query.py was also found stale
#     (retired from the public bucket); this calibration ran against release 2026-09-23.1.
#   * sources.osm_file: ONE sample (the XS area's own Overpass JSON export, 401,774 bytes ->
#     1,709 links). links_per_element = 1709 / 401774 = 0.00425 (links show up roughly every
#     235 bytes of Overpass JSON, not every ~700 bytes as originally guessed). latency_s is a
#     guess scaled down from the network sources (local file parsing has no network round
#     trip); s_per_link is unchanged (consistent with the one sample: predicted 0.27s vs.
#     measured 0.20s for this file).
#   * sources.overture_file: not exercised this round (no local Overture snapshot on hand);
#     left as a guess, same as before.
#   * output.bytes_per_link / output.fixed_bytes: OLS-fit from the 10 OSM runs above (the
#     model is shared across sources -- these are file-format physics, not source-specific).
#     parquet (4 points, 1.7k-303k links) and csv/duckdb/zip (2 points each, 1.7k & 12k links)
#     all show a much larger fixed per-file overhead than previously guessed, confirming the
#     live-UI finding that a 2-link zip export was ~4KB, not the ~142B the old guess produced
#     (zip's `datapackage.json` alone is ~16KB uncompressed; duckdb's ~0.8MB empty-file guess
#     held up well against the new ~0.89MB fit). bytes_per_link dropped for every format now
#     that the fixed overhead is modeled separately instead of being smeared into the slope.
#     csv/duckdb/zip's 2-point fits are exact lines (zero residual by construction); treat them
#     as a reasonable order-of-magnitude, not a tight calibration -- a third size would help.
# Re-fit with the opt-in calibration test (GMNSPY_CALIBRATE=1, see
# packages/gmnspy/tests/test_workbench_estimate.py) and replace these values.

[sources.osm]
latency_s = 29.4           # OLS-fit, 2026-10-02 (4 areas, 10 runs; high variance, see note above)
links_per_element = 3.65   # measured: median(links/ways) across 10 runs
s_per_link = 9.1e-5        # OLS-fit, 2026-10-02 (same 10 runs)

[sources.overture]
latency_s = 17.5           # measured, 2026-10-02: median COUNT(*) pre-query time (8 samples, XS+S)
links_per_element = 1.6    # guess: segments split at connectors, two-way for most classes (UNCHANGED -- build path broken, see note)
s_per_link = 1.0e-4        # borrowed from OSM; full Overture build still not measurable (see note)

[sources.osm_file]
latency_s = 0.1            # guess, scaled down for local parsing (no network round trip)
links_per_element = 0.00425 # measured, 2026-10-02: one sample, 401,774 bytes -> 1,709 links
s_per_link = 1.0e-4        # unchanged; consistent with the one sample (pred 0.27s vs actual 0.20s)

[sources.overture_file]
latency_s = 1.0            # guess: local parquet, no network (UNCHANGED -- not exercised this round)
links_per_element = 1.6    # same guess as overture (UNCHANGED)
s_per_link = 1.0e-4        # borrowed from OSM (UNCHANGED)

[output.bytes_per_link]    # OLS-fit from 10 OSM runs, 2026-10-02 (parquet n=4, others n=2; see note)
parquet = 82
csv = 220
duckdb = 102
zip = 43

[output.fixed_bytes]       # OLS-fit from 10 OSM runs, 2026-10-02 (per-output overhead independent of size)
parquet = 167896
csv = 120029
duckdb = 885811            # matches the old "~0.8 MB empty duckdb file" guess closely
zip = 23297                # confirms the live-UI finding: zip's datapackage.json dominates small outputs
